# Prometheus local apontando para a API local e para o MVP publicado na Azure.
# O alvo da Azure e o token do /metrics são gerados por
# scripts/configurar-prometheus.sh (ficam fora do Git).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: api-local
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
        labels:
          ambiente: local

  - job_name: api-azure
    scheme: https
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/segredos/metrics_token
    file_sd_configs:
      - files: ["/etc/prometheus/alvos/azure*.json"]
