# Pipeline DevSecOps do Passo Firme ("Deploy Blindado").
#
# A cada push e pull request:
#   segredos (Gitleaks) ─┐
#   sast (Semgrep)       ├─> imagem (build + Trivy) ─> deploy (só na main)
#   iac (Terraform+Trivy)│
#   testes (pytest)     ─┘
# Qualquer achado alto ou crítico barra o pipeline antes de chegar ao cidadão.
#
# Endurecimento da própria cadeia:
# - permissões mínimas do GITHUB_TOKEN (só leitura, id-token só no deploy);
# - login na Azure por OIDC, sem senha guardada;
# - Gitleaks em versão fixa e conferido pelo checksum oficial;
# - trivy-action fixado por SHA de commit (em março de 2026 tags dessa action
#   foram reescritas com código malicioso; SHA não muda);
# - Semgrep em imagem com versão fixa.

name: DevSecOps

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGEM: passo-firme-api
  GITLEAKS_VERSION: "8.30.1"

jobs:
  segredos:
    name: Segredos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # histórico inteiro: segredo apagado num commit novo continua vazado

      - name: Instalar Gitleaks (versão fixa + checksum)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          pacote="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${pacote}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${pacote}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check -
          tar -xzf "${pacote}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Varrer o histórico do Git
        run: gitleaks git . --redact --verbose --exit-code 1 --report-format sarif --report-path gitleaks.sarif

      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-gitleaks
          path: gitleaks.sarif
          if-no-files-found: ignore

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.170.0
    steps:
      - uses: actions/checkout@v7

      - name: Analisar código, Dockerfile e segredos
        run: >-
          semgrep scan
          --config p/python
          --config p/dockerfile
          --config p/secrets
          --metrics=off
          --error
          --sarif-output=semgrep.sarif

      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-semgrep
          path: semgrep.sarif
          if-no-files-found: ignore

  iac:
    name: IaC (Terraform + Trivy config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3

      - name: Formatação
        run: terraform fmt -check -recursive -diff infra

      - name: Validação (sem backend e sem credenciais)
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate

      - name: Trivy — configuração insegura (Terraform e Dockerfile)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

  testes:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt

      - run: pip install -r requirements-dev.txt

      - run: pytest

  imagem:
    name: Build + Trivy (imagem)
    needs: [segredos, sast, iac, testes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build da imagem
        uses: docker/build-push-action@v6
        with:
          context: ./api
          load: true
          push: false
          tags: ${{ env.IMAGEM }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy — vulnerabilidades da imagem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGEM }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Exportar a imagem aprovada
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save "${IMAGEM}:${GITHUB_SHA}" | gzip > imagem.tar.gz

      - name: Entregar a imagem ao job de deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: imagem-api
          path: imagem.tar.gz
          retention-days: 3

  deploy:
    name: Deploy (Azure Container Apps)
    needs: imagem
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: producao
      url: ${{ steps.publicar.outputs.url }}
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # troca o token OIDC do GitHub por acesso à Azure
    env:
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      CONTAINER_APP: ${{ vars.CONTAINER_APP }}
    steps:
      - name: Receber a imagem que passou no Trivy
        uses: actions/download-artifact@v4
        with:
          name: imagem-api

      - name: Carregar a imagem
        run: gunzip -c imagem.tar.gz | docker load

      - name: Login na Azure (OIDC, sem senha)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Enviar a imagem ao ACR
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"
          destino="${ACR_LOGIN_SERVER}/${IMAGEM}:${GITHUB_SHA}"
          docker tag "${IMAGEM}:${GITHUB_SHA}" "$destino"
          docker push "$destino"
          echo "DESTINO=$destino" >> "$GITHUB_ENV"

      - name: Atualizar o Container App
        id: publicar
        run: |
          set -euo pipefail
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$DESTINO" \
            --output none
          fqdn=$(az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn --output tsv)
          echo "url=https://${fqdn}" >> "$GITHUB_OUTPUT"

      - name: Teste de fumaça (a versão nova está no ar?)
        env:
          URL: ${{ steps.publicar.outputs.url }}
        run: |
          set -euo pipefail
          for tentativa in $(seq 1 30); do
            versao=$(curl -fsS --max-time 10 "${URL}/health" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("versao",""))' || true)
            if [ "$versao" = "$GITHUB_SHA" ]; then
              echo "No ar: ${URL} (versão ${versao})"
              exit 0
            fi
            echo "Tentativa ${tentativa}: versão no ar = '${versao:-sem resposta}'. Aguardando..."
            sleep 10
          done
          echo "A versão ${GITHUB_SHA} não respondeu em 5 minutos." >&2
          exit 1
